<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 💕</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 80%;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #ff4b2b;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }

        .heart {
            font-size: 50px;
            color: #ff4b2b;
            animation: beat 1s infinite alternate;
            margin: 20px 0;
        }

        @keyframes beat {
            to { transform: scale(1.2); }
        }

        .footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart">❤️</div>
        <h1>Enguun</h1>
        <p>Чи миний амьдралыг илүү гэрэлтэй, илүү аз жаргалтай болгодог. Үргэлж дэмжиж, хамт байдагт чинь баярлалаа.</p>
        <p>Өдрийг сайхан өнгөрүүлээрэй! ✨</p>
        <div class="footer">Үргэлж тусгайлан зориулав...</div>
    </div>

</body>
</html>
