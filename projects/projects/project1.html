<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Aquarium Project</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .instructions {
      background-color: #1e293b;
      padding: 12px 20px;
      border-radius: 8px;
      border-left: 4px solid #38bdf8;
      margin-bottom: 20px;
      max-width: 760px;
      line-height: 1.5;
    }

    #canvas-container {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <h1>Interactive Aquarium 🐠</h1>
  <p class="instructions">
    💡 <strong>Заавар:</strong> Дэлгэц дээр хоёр хуваагдсан интерактив ажиллана:<br>
    - **Усан дотор** дарахад тухайн байрлалд шинэ <strong>Fish (Загас)</strong> үүснэ.<br>
    - **Элсэн дээр** дарахад шинэ <strong>Bubble (Хөөс)</strong> нэмэгдэнэ.
  </p>

  <div id="canvas-container"></div>

  <script>
    let fishes = [];
    let bubbles = [];

    function setup() {
      let canvas = createCanvas(800, 500);
      canvas.parent('canvas-container');
      for (let i = 0; i < 5; i++) {
        fishes.push({
          x: random(0, width),
          y: random(50, height - 100),
          size: random(30, 60),
          speed: random(1.5, 4.0),
          color: color(random(100, 255), random(50, 200), random(100, 255))
        });
      }
      for (let i = 0; i < 10; i++) {
        bubbles.push({
          x: random(0, width),
          y: random(height - 60, height),
          size: random(8, 20),
          speed: random(1, 2.5)
        });
      }
    }

    function draw() {
      drawEnvironment();
      for (let bubble of bubbles) {
        drawBubble(bubble);
        moveBubble(bubble);
      }
      for (let fish of fishes) {
        drawFish(fish.x, fish.y, fish.size, fish.color);
        moveFish(fish);
      }
    }

    function drawEnvironment() {
      background(15, 76, 129);
      noStroke();
      fill(225, 191, 146);
      rect(0, height - 60, width, 60);
      fill(195, 161, 116);
      ellipse(150, height - 20, 40, 15);
      ellipse(400, height - 30, 60, 20);
      ellipse(650, height - 15, 35, 12);
    }
    function drawFish(x, y, size, fishColor) {
      push();
      translate(x, y);

      noStroke();
      fill(fishColor);
      triangle(-size * 0.6, -size * 0.3, -size * 0.6, size * 0.3, 0, 0);
      ellipse(0, 0, size, size * 0.6);

     
      fill(255);
      ellipse(size * 0.25, -size * 0.1, size * 0.2, size * 0.2);
      fill(0);
      ellipse(size * 0.27, -size * 0.1, size * 0.08, size * 0.08);

      pop();
    }

    
    function moveFish(fish) {
      fish.x += fish.speed;

      
      if (fish.x - fish.size > width) {
        fish.x = -fish.size;
        fish.y = random(50, height - 100);
      }
    }

    function drawBubble(bubble) {
      stroke(255, 255, 255, 180);
      strokeWeight(1.5);
      fill(255, 255, 255, 60);
      ellipse(bubble.x, bubble.y, bubble.size);
    }
    function moveBubble(bubble) {
      bubble.y -= bubble.speed;
      bubble.x += sin(frameCount * 0.05 + bubble.y) * 0.5;

      
      if (bubble.y + bubble.size < 0) {
        bubble.y = height + bubble.size;
        bubble.x = random(0, width);
      }
    }
    function mousePressed() {
      if (mouseX >= 0 && mouseX <= width && mouseY >= 0 && mouseY <= height) {
        if (mouseY > height - 60) {
          bubbles.push({
            x: mouseX,
            y: mouseY,
            size: random(8, 22),
            speed: random(1, 3)
          });
        } else {
          fishes.push({
            x: mouseX,
            y: mouseY,
            size: random(30, 65),
            speed: random(1.5, 4.5),
            color: color(random(100, 255), random(50, 200), random(100, 255))
          });
        }
      }
    }
  </script>
</body>
</html>
