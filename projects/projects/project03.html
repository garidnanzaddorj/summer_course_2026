<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Explorer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0d1b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #4da6ff;
    }

    .score-board {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ffcc00;
    }

    canvas {
      border: 2px solid #4da6ff;
      box-shadow: 0 0 20px rgba(77, 166, 255, 0.3);
      background-color: #05050d;
    }

    .controls-info {
      margin-top: 15px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px 20px;
      border-radius: 8px;
      display: inline-block;
    }

    .controls-info h3 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }

    .controls-info p {
      margin: 3px 0;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Space Explorer</h1>
    <div class="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div class="controls-info">
      <h3>Удирдлага:</h3>
      <p>⬅️ ⬆️ ➡️ ⬇️ эсвэл <strong>W, A, S, D</strong> товчлууруудаар залуурдана.</p>
      <p>Ододыг цуглуулж оноогоо нэмэгдүүлээрэй!</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    let playerX = canvas.width / 2;
    let playerY = canvas.height / 2;
    let playerSpeed = 5;
    let playerSize = 20;
    let score = 0;

    let stars = [];
    let bgStars = [];
    const keys = {};

    window.addEventListener("keydown", (e) => (keys[e.key] = true));
    window.addEventListener("keyup", (e) => (keys[e.key] = false));

    function initBackground() {
      for (let i = 0; i < 80; i++) {
        bgStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2,
          opacity: Math.random()
        });
      }
    }

    function initStars() {
      for (let i = 0; i < 10; i++) {
        stars.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: Math.random() * (canvas.height - 40) + 20,
          size: 8
        });
      }
    }

    function drawBackground() {
      ctx.fillStyle = "#05050d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ffffff";
      bgStars.forEach((star) => {
        ctx.globalAlpha = star.opacity;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
    }

    function drawSpaceship(x, y) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = "#00d2ff";
      ctx.beginPath();
      ctx.moveTo(0, -playerSize);
      ctx.lineTo(-playerSize / 1.5, playerSize);
      ctx.lineTo(playerSize / 1.5, playerSize);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(0, -playerSize / 4, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawStar(star) {
      ctx.fillStyle = "#ffcc00";
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = "rgba(255, 204, 0, 0.4)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function movePlayer() {
      if ((keys["ArrowUp"] || keys["w"] || keys["W"]) && playerY - playerSize > 0) {
        playerY -= playerSpeed;
      }
      if ((keys["ArrowDown"] || keys["s"] || keys["S"]) && playerY + playerSize < canvas.height) {
        playerY += playerSpeed;
      }
      if ((keys["ArrowLeft"] || keys["a"] || keys["A"]) && playerX - playerSize > 0) {
        playerX -= playerSpeed;
      }
      if ((keys["ArrowRight"] || keys["d"] || keys["D"]) && playerX + playerSize < canvas.width) {
        playerX += playerSpeed;
      }
    }

    function checkStarCollision(star) {
      const dx = playerX - star.x;
      const dy = playerY - star.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < playerSize + star.size) {
        score += 10;
        scoreElement.innerText = score;
        
        star.x = Math.random() * (canvas.width - 40) + 20;
        star.y = Math.random() * (canvas.height - 40) + 20;
      }
    }

    function gameLoop() {
      drawBackground();
      
      movePlayer();
      drawSpaceship(playerX, playerY);

      stars.forEach((star) => {
        drawStar(star);
        checkStarCollision(star);
      });

      requestAnimationFrame(gameLoop);
    }

    initBackground();
    initStars();
    gameLoop();
  </script>
</body>
</html>
