<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сэтгэлийн Үг</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .heart {
      font-size: 50px;
      animation: beat 1s infinite alternate;
    }

    @keyframes beat {
      to {
        transform: scale(1.2);
      }
    }

    h1 {
      color: #333;
      font-size: 20px;
      margin: 15px 0;
    }

    .message {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      background-color: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    button:hover {
      background-color: #ff5252;
      transform: scale(1.05);
    }

    .hidden {
      display: none;
    }

    #secret-message {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff0f3;
      border-radius: 10px;
      color: #d63384;
      font-weight: 500;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">❤️</div>
    <h1>Миний хайрт болон ангийн анд Ган-Эрдэнэд</h1>
    
    <p class="message">
      Чамдаа болон хамгийн дотно анд Ган-Эрдэнэдээ зориулж энэхүү жижигхэн бэлгийг бэлдлээ. 
      Үргэлж хамт байж, тусалж дэмждэгт баярлалаа!
    </p>

    <button id="btn">Сэтгэлийн үг нээх ✨</button>

    <div id="secret-message" class="hidden">
      <p>🌟 Та хоёр бол миний амьдралын хамгийн чухал хүмүүсийн нэг шүү! Үргэлж хамтдаа инээж, амжилттай байгаарай! 🌟</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('btn');
      const secretMessage = document.getElementById('secret-message');

      button.addEventListener('click', () => {
        if (secretMessage.classList.contains('hidden')) {
          secretMessage.classList.remove('hidden');
          button.textContent = 'Хаах ❌';
        } else {
          secretMessage.classList.add('hidden');
          button.textContent = 'Сэтгэлийн үг нээх ✨';
        }
      });
    });
  </script>
</body>
</html>
